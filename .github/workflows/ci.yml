# Build, unit tests and site checks on every pull request and push to main (Doc 07 Q31).
# Nothing is deployed from here: the host is not chosen yet (OD-03).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for the browser checks
        run: npx playwright install --with-deps chromium
      - name: Unit tests (enquiry function)
        run: npm test
      - name: Build and check (HTML, links, accessibility, page weight, enquiry form)
        run: npm run check
